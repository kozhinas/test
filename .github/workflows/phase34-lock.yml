name: Phase34 Canonical Lockfile Transport

on:
  push:
    branches:
      - phase34-lock-export-20260831

permissions:
  contents: read

jobs:
  transport-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable canonical lockfile
        working-directory: phase34-lock
        run: |
          test -f package-lock.transport-verified.json
          test "$(sha256sum package-lock.transport-verified.json | awk '{print $1}')" = "1ecc0822cf8a4055756f76ff99a3865fe2ffb487213daaf561602ea759610691"
          test "$(git hash-object package-lock.transport-verified.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Upload verified canonical lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase34-canonical-lockfile
          path: phase34-lock/package-lock.transport-verified.json
          if-no-files-found: error
          retention-days: 1
