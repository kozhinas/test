name: Phase34 Lockfile Export

on:
  push:
    branches:
      - phase34-lock-export-20260831

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify exact toolchain
        working-directory: phase34-lock
        run: |
          test "$(node -v)" = "v24.20.0"
          test "$(npm -v)" = "11.19.0"
      - name: Regenerate canonical lockfile
        working-directory: phase34-lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json package-lock.full.json
      - name: Build smaller variants
        working-directory: phase34-lock
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const full = JSON.parse(fs.readFileSync('package-lock.full.json', 'utf8'));
          const workspaceKeys = new Set(['', 'mobile', 'server', 'packages/protocol']);
          const base = ['version','link','dev','optional','devOptional','inBundle','hasInstallScript','os','cpu','libc'];
          const edges = ['dependencies','optionalDependencies','peerDependencies','peerDependenciesMeta'];
          const variants = {
            bothNoEdges: new Set([...base,'resolved','integrity']),
            resolvedNoEdges: new Set([...base,'resolved']),
            integrityNoEdges: new Set([...base,'integrity']),
            resolvedEdges: new Set([...base,...edges,'resolved']),
            integrityEdges: new Set([...base,...edges,'integrity'])
          };
          for (const [name, keep] of Object.entries(variants)) {
            const out = {...full, packages:{}};
            for (const [path, meta] of Object.entries(full.packages || {})) {
              if (workspaceKeys.has(path)) {
                out.packages[path] = meta;
                continue;
              }
              const next = {};
              for (const [key, value] of Object.entries(meta)) if (keep.has(key)) next[key] = value;
              out.packages[path] = next;
            }
            fs.writeFileSync(`package-lock.${name}.json`, JSON.stringify(out));
          }
          NODE
          wc -c package-lock.full.json package-lock.*Edges.json
      - name: Test variants with clean npm ci
        working-directory: phase34-lock
        shell: bash
        run: |
          set +e
          : > variant-results.txt
          for variant in bothNoEdges resolvedNoEdges integrityNoEdges resolvedEdges integrityEdges; do
            rm -rf node_modules mobile/node_modules server/node_modules packages/protocol/node_modules
            cp "package-lock.${variant}.json" package-lock.json
            before="$(sha256sum package-lock.json | awk '{print $1}')"
            npm ci --ignore-scripts >"npm-ci-${variant}.log" 2>&1
            status=$?
            after="$(sha256sum package-lock.json | awk '{print $1}')"
            bytes="$(wc -c < package-lock.json)"
            echo "${variant}: status=${status} bytes=${bytes} unchanged=$([ "$before" = "$after" ] && echo yes || echo no) sha256=${after}" | tee -a variant-results.txt
            if [ "$status" -ne 0 ]; then tail -n 12 "npm-ci-${variant}.log"; fi
          done
          cat variant-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase34-lock-small-variants
          path: |
            phase34-lock/package-lock.bothNoEdges.json
            phase34-lock/package-lock.resolvedNoEdges.json
            phase34-lock/package-lock.integrityNoEdges.json
            phase34-lock/package-lock.resolvedEdges.json
            phase34-lock/package-lock.integrityEdges.json
            phase34-lock/variant-results.txt
          if-no-files-found: error
          retention-days: 1
