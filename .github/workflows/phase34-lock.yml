name: Phase34 Lockfile Cross-Repo Probe

on:
  push:
    branches:
      - phase34-lock-export-20260831

permissions:
  contents: write

jobs:
  export-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify exact toolchain
        run: |
          test "$(node -v)" = "v24.20.0"
          test "$(npm -v)" = "11.19.0"
      - name: Generate and verify canonical lockfile
        working-directory: phase34-lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "1ecc0822cf8a4055756f76ff99a3865fe2ffb487213daaf561602ea759610691"
          npm ci --ignore-scripts
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "1ecc0822cf8a4055756f76ff99a3865fe2ffb487213daaf561602ea759610691"
      - name: Probe repository-scoped token against private messenger temp branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/kozhinas/messenger.git"
          git -c credential.helper= fetch "$remote" tmp/phase34-lock-import-20260831
          git worktree add /tmp/messenger-import FETCH_HEAD
          cp phase34-lock/package-lock.json /tmp/messenger-import/package-lock.json
          cd /tmp/messenger-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "Lock Phase 3/4 dependency graph"
          git -c credential.helper= push "$remote" HEAD:tmp/phase34-lock-import-20260831
