name: Phase34 Canonical Lockfile Transport

on:
  push:
    branches:
      - phase34-lock-export-20260831

permissions:
  contents: read

jobs:
  transport-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify immutable canonical lockfile identity
        working-directory: phase34-lock
        run: |
          test "$(node -v)" = "v24.20.0"
          test "$(npm -v)" = "11.19.0"
          test -f package-lock.transport-verified.json
          cp package-lock.transport-verified.json package-lock.json
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Validate full canonical dependency graph on runner
        working-directory: phase34-lock
        run: |
          npm ci
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
          node -e "for (const name of ['typescript','eslint','vitest','expo','react-native','react-native-webrtc']) { const p=require('./node_modules/' + name + '/package.json'); console.log(name + '=' + p.version) }"
      - name: Classify locked audit findings
        working-directory: phase34-lock
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-runtime.json || true
          npm audit --omit=dev --workspace @private/mobile --json > /tmp/audit-mobile-runtime.json || true
          npm audit --omit=dev --workspace @private/server --json > /tmp/audit-server-runtime.json || true
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [
            ['all', '/tmp/audit-all.json'],
            ['runtime', '/tmp/audit-runtime.json'],
            ['mobile-runtime', '/tmp/audit-mobile-runtime.json'],
            ['server-runtime', '/tmp/audit-server-runtime.json'],
          ]) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`AUDIT ${label} summary=${JSON.stringify(audit.metadata?.vulnerabilities ?? null)}`);
            for (const [name, value] of Object.entries(audit.vulnerabilities ?? {})) {
              const via = (value.via ?? []).map((entry) => typeof entry === 'string' ? entry : {
                name: entry.name,
                severity: entry.severity,
                title: entry.title,
                range: entry.range,
              });
              console.log(`AUDIT ${label} finding=${JSON.stringify({name,severity:value.severity,isDirect:value.isDirect,via,effects:value.effects,range:value.range,fixAvailable:value.fixAvailable})}`);
            }
          }
          NODE
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Probe npm install-script policy and esbuild runtime
        working-directory: phase34-lock
        run: |
          npm install-scripts ls --json | tee /tmp/install-scripts-pending.json
          ./node_modules/.bin/esbuild --version
          node -e "const esbuild=require('esbuild'); const out=esbuild.transformSync('const x = 1'); if (!out.code.includes('const x')) process.exit(1); console.log('esbuild-api-version=' + esbuild.version)"
          cp package.json /tmp/package.before-approval.json
          npm install-scripts approve esbuild
          node -e "const p=require('./package.json'); console.log('allowScripts=' + JSON.stringify(p.allowScripts ?? null)); if (!p.allowScripts || p.allowScripts['esbuild@0.28.2'] !== true) process.exit(1)"
          npm install-scripts ls --json | tee /tmp/install-scripts-after-approval.json
          cp /tmp/package.before-approval.json package.json
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Validate server build dependency slice
        working-directory: phase34-lock
        run: |
          npm ci --workspace @private/protocol --workspace @private/server
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Validate server production dependency slice
        working-directory: phase34-lock
        run: |
          npm ci --omit=dev --workspace @private/protocol --workspace @private/server
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Validate Docker closure image full dependency graph
        run: |
          rm -rf /tmp/phase34-docker-full
          cp -R phase34-lock /tmp/phase34-docker-full
          rm -rf /tmp/phase34-docker-full/node_modules
          docker run --rm -v /tmp/phase34-docker-full:/work -w /work node:24.20.0 bash -lc '
            test "$(node -v)" = "v24.20.0" &&
            test "$(npm -v)" = "11.19.0" &&
            npm ci &&
            test "$(sha256sum package-lock.json | awk '\''{print $1}'\'')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          '
          test "$(git hash-object /tmp/phase34-docker-full/package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Validate pinned Alpine image dependency slices
        run: |
          rm -rf /tmp/phase34-alpine-build /tmp/phase34-alpine-prod
          cp -R phase34-lock /tmp/phase34-alpine-build
          cp -R phase34-lock /tmp/phase34-alpine-prod
          rm -rf /tmp/phase34-alpine-build/node_modules /tmp/phase34-alpine-prod/node_modules
          docker run --rm -v /tmp/phase34-alpine-build:/work -w /work node:24.20.0-alpine3.24 sh -lc '
            test "$(node -v)" = "v24.20.0" &&
            test "$(npm -v)" = "11.19.0" &&
            npm ci --workspace @private/protocol --workspace @private/server &&
            test "$(sha256sum package-lock.json | awk '\''{print $1}'\'')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          '
          docker run --rm -v /tmp/phase34-alpine-prod:/work -w /work node:24.20.0-alpine3.24 sh -lc '
            test "$(node -v)" = "v24.20.0" &&
            test "$(npm -v)" = "11.19.0" &&
            npm ci --omit=dev --workspace @private/protocol --workspace @private/server &&
            test "$(sha256sum package-lock.json | awk '\''{print $1}'\'')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          '
          test "$(git hash-object /tmp/phase34-alpine-build/package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
          test "$(git hash-object /tmp/phase34-alpine-prod/package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
      - name: Upload verified canonical lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase34-canonical-lockfile
          path: phase34-lock/package-lock.transport-verified.json
          if-no-files-found: error
          retention-days: 1
