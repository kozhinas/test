name: Phase34 allowScripts probe

on:
  push:
    branches: [phase34-lock-export-20260831]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      npm_config_registry: https://evil.example.invalid/
      npm_config_replace_registry_host: always
      npm_config_strict_allow_scripts: 'false'
      npm_config_dangerously_allow_all_scripts: 'true'
      npm_config_ignore_scripts: 'true'
      npm_config_strict_ssl: 'false'
      npm_config_audit: 'true'
      npm_config_fund: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify exact npm
        run: test "$(npm -v)" = "11.19.0"
      - name: Positive explicit policy overrides hostile env
        working-directory: phase34-lock
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.transport-verified.json package-lock.json
          rm -f .npmrc
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.allowScripts = {
            'esbuild@0.28.2': true,
            'fsevents@2.3.3': true,
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm ci \
            --registry=https://registry.npmjs.org/ \
            --replace-registry-host=never \
            --strict-allow-scripts=true \
            --dangerously-allow-all-scripts=false \
            --ignore-scripts=false \
            --strict-ssl=true \
            --audit=false \
            --fund=false
          test "$(./node_modules/.bin/esbuild --version)" = "0.28.2"
      - name: Negative missing approval must hard fail despite hostile env
        working-directory: phase34-lock
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete p.allowScripts['esbuild@0.28.2'];
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          rm -rf node_modules
          set +e
          output="$(npm ci \
            --registry=https://registry.npmjs.org/ \
            --replace-registry-host=never \
            --strict-allow-scripts=true \
            --dangerously-allow-all-scripts=false \
            --ignore-scripts=false \
            --strict-ssl=true \
            --audit=false \
            --fund=false 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'ESTRICTALLOWSCRIPTS'
