name: Phase34 current deploy rollback proof

on:
  push:
    branches: [phase34-deploy-rollback-proof-20260905]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Verify exact current deploy blob
        working-directory: phase34-deploy-proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = "v24.20.0"
          test "$(npm -v)" = "11.19.0"
          test "$(git hash-object phase-3-4-deploy.mjs)" = "a721f34dd749b7eb03aa10a76ef491225819684a"
      - name: Execute deployment rollback scenarios
        working-directory: phase34-deploy-proof
        run: node deploy-rollback-selftest.mjs
