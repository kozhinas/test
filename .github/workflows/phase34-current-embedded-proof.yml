name: Phase34 Current Embedded Proof

on:
  push:
    branches:
      - phase34-current-embedded-proof-20260905

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify exact current private fixture blobs
        run: |
          test "$(git hash-object phase34-current-embedded/scripts/phase-3-4-embedded-lockfile.mjs)" = "59e7575891dc2f6f52513f87ee5268eedefe8ed7"
          test "$(git hash-object phase34-current-embedded/infra/lockfile/README.md)" = "e6545e8509a3120d69c69ff5925e40b080273f2f"
      - name: Rebuild exact committed part bytes from immutable source
        working-directory: phase34-current-embedded
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { brotliCompressSync, constants } from 'node:zlib';

          const url = 'https://raw.githubusercontent.com/kozhinas/test/1f7aefd24097d7269acde43c8b8ec4c1319eb53f/phase34-lock/package-lock.transport-verified.json';
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error(`source HTTP ${response.status}`);
          const source = Buffer.from(await response.arrayBuffer());
          const sourceSha = createHash('sha256').update(source).digest('hex');
          if (source.length !== 261242 || sourceSha !== 'f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4') {
            throw new Error(`source mismatch bytes=${source.length} sha=${sourceSha}`);
          }

          const compressed = brotliCompressSync(source, {
            params: {
              [constants.BROTLI_PARAM_QUALITY]: 11,
              [constants.BROTLI_PARAM_MODE]: constants.BROTLI_MODE_GENERIC,
            },
          });
          const compressedSha = createHash('sha256').update(compressed).digest('hex');
          if (compressed.length !== 64464 || compressedSha !== 'eb3c412540c423657926dcc6516b1f1393e9da56b588f18916984a7445e30b24') {
            throw new Error(`compressed mismatch bytes=${compressed.length} sha=${compressedSha}`);
          }
          const encoded = compressed.toString('base64');
          if (encoded.length !== 85952) throw new Error(`base64 length mismatch ${encoded.length}`);

          const parts = [
            ['phase34-lockfile.part-01.br.b64', 15000],
            ['phase34-lockfile.part-02.br.b64', 15000],
            ['phase34-lockfile.part-03.br.b64', 15000],
            ['phase34-lockfile.part-04.br.b64', 10000],
            ['phase34-lockfile.part-05.br.b64', 5000],
            ['phase34-lockfile.part-06.br.b64', 15000],
            ['phase34-lockfile.part-07.br.b64', 10952],
          ];
          await mkdir('infra/lockfile', { recursive: true });
          let offset = 0;
          for (const [name, length] of parts) {
            const body = encoded.slice(offset, offset + length);
            if (body.length !== length) throw new Error(`short part ${name}`);
            await writeFile(`infra/lockfile/${name}`, `${body}\n`, 'utf8');
            offset += length;
          }
          if (offset !== encoded.length) throw new Error(`split mismatch ${offset} != ${encoded.length}`);
          NODE
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-01.br.b64)" = "ba66c40458f0af1f0e5d909131f2fca6b9bbdf19"
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-02.br.b64)" = "2af54bc9a6122bd30c55e53a28b34c7a79a7d474"
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-03.br.b64)" = "f67d9c601a454f522db4c07fb2f0bf0c98dc53df"
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-04.br.b64)" = "aa2c57cda315888687d69f215a10d720fc58e1a7"
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-05.br.b64)" = "76c0dccdf35f22de6c171c21a8b1258ce26c7afe"
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-06.br.b64)" = "269f20723887e8ab86f8f327ad9ed7d27b2974ec"
          test "$(git hash-object infra/lockfile/phase34-lockfile.part-07.br.b64)" = "45f238dfb87429d335cf8e42efcd55796f631be2"
      - name: Commit generated exact parts into synthetic clean checkout
        run: |
          git config user.email phase34-proof@example.invalid
          git config user.name "Phase34 Proof"
          git add phase34-current-embedded/infra/lockfile/phase34-lockfile.part-*.br.b64
          git commit -m "Synthetic exact embedded lockfile parts"
      - name: Execute current materializer verify-only
        working-directory: phase34-current-embedded
        run: node scripts/phase-3-4-embedded-lockfile.mjs --verify-only
      - name: Execute current materializer clean-checkout write
        working-directory: phase34-current-embedded
        run: |
          node scripts/phase-3-4-embedded-lockfile.mjs
          test "$(wc -c < package-lock.json)" = "261242"
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "f017a37b9e62b2c24ee665b74998397b7e34d403c845b10ce8865dc293f41be4"
          test "$(git hash-object package-lock.json)" = "dddf2eefca5cf347dbc3b48eb185ee4ccd9f24af"
          test "$(stat -c '%a' package-lock.json)" = "600"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: Prove unexpected embedded entry fails closed
        working-directory: phase34-current-embedded
        run: |
          rm -f package-lock.json
          printf 'unexpected\n' > infra/lockfile/unexpected.txt
          if node scripts/phase-3-4-embedded-lockfile.mjs --verify-only; then
            echo "unexpected directory entry was accepted" >&2
            exit 1
          fi
